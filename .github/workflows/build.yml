name: Build
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-gdal:
    name: gdal-async (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install --ignore-scripts

      - name: Build gdal-async native binary from source
        run: |
          cd node_modules/gdal-async
          npx @mapbox/node-pre-gyp configure
          npx @mapbox/node-pre-gyp build -j "$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: gdal-binary-${{ matrix.arch }}
          path: node_modules/gdal-async/lib/binding/
          if-no-files-found: error

  pack:
    needs: [build-gdal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: gdal-binary-x64
          path: tmp/x64

      - uses: actions/download-artifact@v4
        with:
          name: gdal-binary-arm64
          path: tmp/arm64

      - name: Merge prebuilt binaries into gdal-async
        run: |
          mkdir -p node_modules/gdal-async/lib/binding
          cp -r tmp/x64/* node_modules/gdal-async/lib/binding/
          cp -r tmp/arm64/* node_modules/gdal-async/lib/binding/

      - run: npm run build
      - run: npm test

      - name: Package tarball
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: signalk-weather-routing-tgz
          path: "*.tgz"
