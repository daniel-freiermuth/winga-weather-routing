name: Publish
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  id-token: write

jobs:
  build-gdal:
    name: gdal-async (${{ matrix.arch }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            node-version: '22'
          - arch: x64
            runner: ubuntu-latest
            node-version: '24'
          - arch: arm64
            runner: ubuntu-24.04-arm
            node-version: '22'
          - arch: arm64
            runner: ubuntu-24.04-arm
            node-version: '24'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install --ignore-scripts

      - name: Build gdal-async native binary from source
        run: |
          cd node_modules/gdal-async
          npx @mapbox/node-pre-gyp configure
          npx @mapbox/node-pre-gyp build -j "$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: gdal-binary-${{ matrix.arch }}-node${{ matrix.node-version }}
          path: node_modules/gdal-async/lib/binding/
          if-no-files-found: error

  publish:
    needs: [build-gdal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: gdal-binary-x64-node22
          path: tmp/x64/node22
      - uses: actions/download-artifact@v4
        with:
          name: gdal-binary-x64-node24
          path: tmp/x64/node24
      - uses: actions/download-artifact@v4
        with:
          name: gdal-binary-arm64-node22
          path: tmp/arm64/node22
      - uses: actions/download-artifact@v4
        with:
          name: gdal-binary-arm64-node24
          path: tmp/arm64/node24

      - name: Assemble sub-packages
        run: |
          VERSION=$(node -p "require('./package.json').version")

          for pkg in packages/wr-gdal-linux-*; do
            (cd "$pkg" && npm version "$VERSION" --no-git-tag-version)
            cp -r LICENSES "$pkg/"
          done

          # x64 sub-package
          mkdir -p packages/wr-gdal-linux-x64/binding
          cp -r tmp/x64/node22/* packages/wr-gdal-linux-x64/binding/
          cp -r tmp/x64/node24/* packages/wr-gdal-linux-x64/binding/

          # arm64 sub-package
          mkdir -p packages/wr-gdal-linux-arm64/binding
          cp -r tmp/arm64/node22/* packages/wr-gdal-linux-arm64/binding/
          cp -r tmp/arm64/node24/* packages/wr-gdal-linux-arm64/binding/

      - name: Publish x64 sub-package
        run: cd packages/wr-gdal-linux-x64 && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish arm64 sub-package
        run: cd packages/wr-gdal-linux-arm64 && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install x64 binary for test runner
        run: |
          mkdir -p node_modules/gdal-async/lib/binding
          cp -r tmp/x64/node22/* node_modules/gdal-async/lib/binding/
          cp -r tmp/x64/node24/* node_modules/gdal-async/lib/binding/

      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
