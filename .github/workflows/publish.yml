name: Publish
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --ignore-scripts

      - name: Read gdal-async version
        id: gdal-version
        run: echo "version=$(node -p "require('./node_modules/gdal-async/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download prebuilt binaries from wr-gdal-async-prebuilt
        run: |
          gh release download "gdal-async-${{ steps.gdal-version.outputs.version }}" \
            --repo kristianwiklund/wr-gdal-async-prebuilt \
            --dir tmp/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract binaries
        run: |
          mkdir -p tmp/x64/node22 tmp/x64/node24 tmp/arm64/node22 tmp/arm64/node24
          tar xzf tmp/gdal-binary-x64-node22.tar.gz    -C tmp/x64/node22/
          tar xzf tmp/gdal-binary-x64-node24.tar.gz    -C tmp/x64/node24/
          tar xzf tmp/gdal-binary-arm64-node22.tar.gz  -C tmp/arm64/node22/
          tar xzf tmp/gdal-binary-arm64-node24.tar.gz  -C tmp/arm64/node24/

      - name: Assemble sub-packages
        run: |
          GDAL_ASYNC_VERSION=$(node -p "require('./node_modules/gdal-async/package.json').version")

          for pkg in packages/wr-gdal-linux-*; do
            (cd "$pkg" && npm version "$GDAL_ASYNC_VERSION" --no-git-tag-version)
            cp -r LICENSES "$pkg/"
          done

          # x64 sub-package
          mkdir -p packages/wr-gdal-linux-x64/binding
          cp -r tmp/x64/node22/binding/* packages/wr-gdal-linux-x64/binding/
          cp -r tmp/x64/node24/binding/* packages/wr-gdal-linux-x64/binding/

          # arm64 sub-package
          mkdir -p packages/wr-gdal-linux-arm64/binding
          cp -r tmp/arm64/node22/binding/* packages/wr-gdal-linux-arm64/binding/
          cp -r tmp/arm64/node24/binding/* packages/wr-gdal-linux-arm64/binding/

      - name: Publish x64 sub-package
        run: |
          GDAL_ASYNC_VERSION=$(node -p "require('./node_modules/gdal-async/package.json').version")
          PKG="@kristianwiklund/wr-gdal-linux-x64"
          if npm view "${PKG}@${GDAL_ASYNC_VERSION}" version 2>/dev/null; then
            echo "${PKG}@${GDAL_ASYNC_VERSION} already published — skipping"
          else
            cd packages/wr-gdal-linux-x64 && npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish arm64 sub-package
        run: |
          GDAL_ASYNC_VERSION=$(node -p "require('./node_modules/gdal-async/package.json').version")
          PKG="@kristianwiklund/wr-gdal-linux-arm64"
          if npm view "${PKG}@${GDAL_ASYNC_VERSION}" version 2>/dev/null; then
            echo "${PKG}@${GDAL_ASYNC_VERSION} already published — skipping"
          else
            cd packages/wr-gdal-linux-arm64 && npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install x64 binary for test runner
        run: |
          mkdir -p node_modules/gdal-async/lib/binding
          cp -r tmp/x64/node22/binding/* node_modules/gdal-async/lib/binding/
          cp -r tmp/x64/node24/binding/* node_modules/gdal-async/lib/binding/

      - run: pnpm build
      - run: pnpm test
      - run: pnpm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
