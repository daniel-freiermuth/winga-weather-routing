<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Routing</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { display: flex; height: 100vh; background: #1e2230; font-family: sans-serif; font-size: 14px; }
      #app { display: contents; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // SignalK helmet sets Referrer-Policy: no-referrer — override for tile requests
      const _origCreateTile = L.TileLayer.prototype.createTile;
      L.TileLayer.prototype.createTile = function (coords, done) {
        const tile = _origCreateTile.call(this, coords, done);
        tile.referrerPolicy = 'strict-origin-when-cross-origin';
        return tile;
      };
    </script>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
